# GoReleaser config (schema v2). Docs: https://goreleaser.com
# Test locally without a tag:  goreleaser release --snapshot --clean
version: 2

project_name: tars

before:
  hooks:
    - go mod tidy

builds:
  - id: tars
    main: ./cmd/tars
    binary: tars
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: tars
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

# Publishes a Homebrew cask to cloudwalksolutions/homebrew-tap.
homebrew_casks:
  - name: tars
    repository:
      owner: cloudwalksolutions
      name: homebrew-tap
      git:
        url: git@github.com:cloudwalksolutions/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    # Skip the tap push for snapshots/prereleases (so local snapshot builds and
    # pre-1.0 prereleases don't need the tap). Full releases push normally.
    skip_upload: auto
    homepage: "https://github.com/cloudwalksolutions/machine-setup"
    description: "tars — dev-machine setup CLI (dotfiles, tools, fonts, terminals, byobu sessions, git profiles)"
    # Remove the quarantine xattr so the unsigned binary runs without a Gatekeeper prompt.
    # Homebrew 7 deprecated the `postflight` block goreleaser's `hooks` render; this is
    # the declarative `postflight_steps` replacement.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/tars"]
        end
      end

release:
  draft: false
  prerelease: auto
  target_commitish: "{{ .FullCommit }}"
