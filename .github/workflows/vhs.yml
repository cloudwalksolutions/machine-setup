name: vhs

# Re-record the README demo GIFs whenever a tape changes on main.
on:
  push:
    branches: [main]
    paths: ["vhs/**.tape"]

permissions:
  contents: write

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Install byobu for the sessions tape
        run: sudo apt-get update && sudo apt-get install -y byobu tmux
      - name: Build tars onto PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          (cd cli && go build -o "$RUNNER_TEMP/bin/tars" .)
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: charmbracelet/vhs-action@v2
        with:
          path: vhs/demo.tape
      - uses: charmbracelet/vhs-action@v2
        with:
          path: vhs/sessions.tape
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Re-record VHS demos"
          file_pattern: "vhs/*.gif"
