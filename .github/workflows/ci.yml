name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: cli
      - name: go mod tidy is a no-op
        working-directory: cli
        run: go mod tidy -diff

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # badge commit on the badges branch (main only)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Generate coverage profile
        working-directory: cli
        run: go test ./... -coverprofile=cover.out -covermode=atomic -coverpkg=./...
      - name: Coverage gate + badge
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./cli/.testcoverage.yml
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges

  e2e-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f test/e2e/Dockerfile -t tars-e2e .

  nvim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}   # stdpath("config") → the repo's nvim/
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install plugins from lazy-lock.json
        run: nvim --headless "+Lazy! restore" +qa
      - name: Headless smoke tests
        run: nvim -u nvim/init.lua --headless -l nvim/tests/smoke_test.lua

  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
